name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and test
        run: ./gradlew --no-daemon check :mod:modFolder
      - name: Upload the mod folder
        uses: actions/upload-artifact@v7
        with:
          name: Jumpstart-mod
          path: mod/build/mod
