name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Jumpstart and BiteCheck on all three systems the players use
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and test
        shell: bash
        # Jumpstart.jar needs the fork built against the game (kits.yml); here the code and its tests
        run: ./gradlew --no-daemon check

  # jsNative.dll, the Windows loader that starts Jumpstart.jar (kit/native-loader.sh); uploaded so it
  # can be tried with the real game before a release
  native-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64
      - run: bash kit/native-loader.sh third_party/zombiebuddy-jumpstart dist-native
      - uses: actions/upload-artifact@v4
        with:
          name: jsNative
          path: dist-native/jsNative.dll

  # the Cloudflare Worker (cloud/) in Miniflare
  cloud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci --include=dev
      - run: npm test
