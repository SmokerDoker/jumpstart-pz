name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Jumpstart and BiteCheck on all three systems the players use
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and test
        shell: bash
        run: ./gradlew --no-daemon check :mod:modFolder
      - name: Upload the mod folder
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: Jumpstart-mod
          path: mod/build/mod

  # the Cloudflare Worker (cloud/) in Miniflare
  cloud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci --include=dev
      - run: npm test
