# Builds the downloads and publishes them:
#   Jumpstart-windows-x64.msi, Jumpstart-macos-arm64.dmg, Jumpstart-macos-x64.dmg,
#   Jumpstart-linux-x64.deb, Jumpstart-linux-x64.rpm   one-click installers with their own Java
#   JumpstartSetup.jar                                  the same installer for any Java 21+ (Steam Deck, servers)
#   jumpstart-payload.zip, jumpstart-release.txt(.sig)  tags only: what the automatic updates install,
#                                                       signed with the JUMPSTART_SIGNING_KEY secret
#   jumpstart-windows-<v>.zip, jumpstart-macos-<v>.tar.gz, jumpstart-linux-<v>.tar.gz (script kits)
#   jumpstart-server-<v>.zip (dedicated servers)
# Each holds the ZombieBuddy fork (built here from SmokerDoker/zombiebuddy-jumpstart, branch
# jumpstart/hotswap, against projectzomboid.jar of the dedicated server, downloaded anonymously from
# Steam) as Java agent and as mod folder (no Workshop subscription needed), and the Jumpstart mod.
#   push to main  -> pre-release "test-kit" (replaced on every push)
#   tag v*        -> release with that version
name: Kits

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kits:
    runs-on: ubuntu-latest
    outputs:
      kit_version: ${{ steps.version.outputs.kit_version }}
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/checkout@v7
        with:
          repository: SmokerDoker/zombiebuddy-jumpstart
          ref: jumpstart/hotswap
          path: fork

      - name: Download projectzomboid.jar (dedicated server, public branch)
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
        run: |
          set -euo pipefail
          dd="$(bash .github/scripts/depotdownloader.sh)"
          tool="$(dirname "$dd")"
          dir="$RUNNER_TEMP/pz-server"
          mkdir -p "$dir"
          printf '%s\n' 'java/projectzomboid.jar' 'regex:projectzomboid\.jar$' > "$tool/files.txt"
          for attempt in 1 2 3; do
            if "$dd" -app 380870 -os linux -osarch 64 -filelist "$tool/files.txt" -dir "$dir" > "$RUNNER_TEMP/dd.log" 2>&1 \
               && [ -f "$dir/java/projectzomboid.jar" ]; then
              break
            fi
            tail -n 20 "$RUNNER_TEMP/dd.log"
            echo "::warning::download attempt $attempt failed, retrying"
            sleep 15
          done
          test -f "$dir/java/projectzomboid.jar"
          echo "PZ_JAR=$dir/java/projectzomboid.jar" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Build the ZombieBuddy fork
        working-directory: fork/java
        run: |
          gradle --no-daemon "-PgameClasspath=$PZ_JAR" shadowJar
          ls -l build/*/libs/
          # the shadow jar is named after the checkout folder; it is the biggest jar there
          jar="$(ls -S build/*/libs/*.jar | head -n 1)"
          unzip -l "$jar" | grep -q 'me/zed_0xff/zombie_buddy/HostServer.class'
          echo "FORK_JAR=$PWD/$jar" >> "$GITHUB_ENV"

      - name: Build Jumpstart
        run: JAVA_HOME="$JAVA_HOME_21_X64" ./gradlew --no-daemon check :mod:modFolder

      - name: The fork's ZombieBuddy mod folder
        run: bash kit/zombiebuddy-mod.sh fork "$FORK_JAR" dist-mods

      - name: Version
        id: version
        run: |
          # kits: the tag or test-<date>-<sha>; installers (jpackage): x.y.z that grows with every build
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; a="$v"; else v="test-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"; a="0.1.${GITHUB_RUN_NUMBER}"; fi
          echo "KIT_VERSION=$v" >> "$GITHUB_ENV"
          echo "kit_version=$v" >> "$GITHUB_OUTPUT"
          echo "app_version=$a" >> "$GITHUB_OUTPUT"

      - name: Build the kits
        run: bash kit/build-kits.sh dist-mods/ZombieBuddy mod/build/mod/Jumpstart dist "$KIT_VERSION"

      - name: Build the installer jar
        run: |
          JAVA_HOME="$JAVA_HOME_21_X64" ./gradlew --no-daemon :installer:installerJar             "-PzombieBuddyMod=$PWD/dist-mods/ZombieBuddy" "-PkitVersion=$KIT_VERSION"
          cp installer/build/setup/JumpstartSetup.jar dist/
          cp installer/build/payload/payload.zip dist/jumpstart-payload.zip
          # the installer installs into a fake game and Zomboid folder and removes it again
          home="$RUNNER_TEMP/home"; game="$RUNNER_TEMP/game/projectzomboid"; mkdir -p "$home" "$game"
          echo game > "$game/projectzomboid.jar"
          java -Duser.home="$home" -jar dist/JumpstartSetup.jar --install --game-dir "$RUNNER_TEMP/game" || test $? -eq 4 # 4: no Steam here for the launch options
          test -f "$game/ZombieBuddy.jar" && test -f "$home/Zomboid/mods/ZombieBuddy/libs/ZombieBuddy.jar" && test -f "$home/Zomboid/mods/Jumpstart/42/mod.info"
          java -Duser.home="$home" -jar dist/JumpstartSetup.jar --uninstall --game-dir "$RUNNER_TEMP/game" || test $? -eq 4
          test ! -e "$home/Zomboid/mods/Jumpstart"

      - uses: actions/upload-artifact@v7
        with:
          name: kits
          path: dist

  # one native installer per system, built on that system (jpackage cannot cross-build)
  installers:
    needs: kits
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, type: msi, label: windows-x64 }
          - { os: macos-15, type: dmg, label: macos-arm64 }
          - { os: macos-15-intel, type: dmg, label: macos-x64 }
          - { os: ubuntu-22.04, type: deb, label: linux-x64 }
          - { os: ubuntu-22.04, type: rpm, label: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v8
        with:
          name: kits
          path: kits
      - name: Install packaging tools
        shell: bash
        run: |
          case "${{ matrix.type }}" in
            deb) sudo apt-get update -q && sudo apt-get install -y -q fakeroot ;;
            rpm) sudo apt-get update -q && sudo apt-get install -y -q rpm ;;
            msi)
              # jpackage needs the WiX Toolset 3 (candle.exe, light.exe)
              if ! command -v candle.exe >/dev/null; then
                wix="$(ls -d "/c/Program Files (x86)/WiX Toolset v3"*/bin 2>/dev/null | head -n 1 || true)"
                if [ -z "$wix" ]; then choco install wixtoolset -y --no-progress; wix="$(ls -d "/c/Program Files (x86)/WiX Toolset v3"*/bin | head -n 1)"; fi
                echo "$wix" >> "$GITHUB_PATH"
              fi
              ;;
          esac
      - name: Build the installer
        shell: bash
        run: |
          bash kit/package-installer.sh kits/JumpstartSetup.jar "${{ needs.kits.outputs.app_version }}" "${{ matrix.type }}" out
          cd out
          for f in *; do mv "$f" "Jumpstart-${{ matrix.label }}.${f##*.}"; done
          ls -la
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.label }}-${{ matrix.type }}
          path: out/*

  publish:
    needs: [kits, installers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: actions/checkout@v7
        with:
          path: repo
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect and checksum
        run: |
          mkdir dist
          find artifacts -type f -exec cp {} dist/ \;
          rm -f dist/SHA256SUMS.txt
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Sign the release for the automatic updates (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          JUMPSTART_SIGNING_KEY: ${{ secrets.JUMPSTART_SIGNING_KEY }}
          KIT_VERSION: ${{ needs.kits.outputs.kit_version }}
        run: |
          set -euo pipefail
          if [ -z "$JUMPSTART_SIGNING_KEY" ]; then
            echo "::error::The secret JUMPSTART_SIGNING_KEY is missing: a release without a signature would never reach anybody through the automatic updates. See kit/RELEASING.md."
            exit 1
          fi
          java repo/kit/ReleaseSign.java manifest dist "$KIT_VERSION" "$GITHUB_REF_NAME"
          java repo/kit/ReleaseSign.java sign dist/jumpstart-release.txt
          # the signature must fit the key built into the installers
          key="$(grep -o 'PUBLIC = "[^"]*"' repo/installer/src/main/java/io/github/jumpstartpz/installer/ReleaseKey.java | cut -d'"' -f2)"
          java repo/kit/ReleaseSign.java verify dist/jumpstart-release.txt "$key"
          cd dist && rm -f SHA256SUMS.txt && sha256sum * > SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KIT_VERSION: ${{ needs.kits.outputs.kit_version }}
        run: |
          set -euo pipefail
          notes="Automatic updates: installed with the box ticked, Jumpstart updates itself before every game start to the newest signed release (not to test-kit). Install with one click: Jumpstart-windows-x64.msi, Jumpstart-macos-arm64.dmg (Apple Silicon), Jumpstart-macos-x64.dmg (Intel), Jumpstart-linux-x64.deb or .rpm, or JumpstartSetup.jar with any Java 21+ (Steam Deck). They bring the ZombieBuddy fork along: no Workshop subscription, no ZombieBuddy installer. Script kits for Windows, macOS, Linux and dedicated servers as before (TESTPLAN.md, SERVER.md). Built from ${GITHUB_SHA::7}; ZombieBuddy fork from SmokerDoker/zombiebuddy-jumpstart (jumpstart/hotswap)."
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$REPO" --title "Jumpstart $KIT_VERSION" --notes "$notes"
          else
            gh release delete test-kit --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
            gh release create test-kit dist/* --repo "$REPO" --prerelease --target "$GITHUB_SHA"               --title "Jumpstart test kit ($KIT_VERSION)" --notes "$notes"
          fi
